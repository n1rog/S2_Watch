[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2-watch"
version = "0.1.0"
description = "Cross-platform desktop monitor for radio application messages"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
s2-watch = "s2_watch.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["s2_watch*"]

[tool.setuptools.package-data]
s2_watch = ["data/*.geojson", "data/*.json", "data/web/*"]
