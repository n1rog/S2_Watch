# Tests, installer checks, and releases.
#
# Every push: tests + the Linux installer (cheap). A version tag (v1.2.3) or a manual run
# (Actions tab -> CI -> Run workflow): tests and installers on Linux, Windows and macOS, and
# for a tag, a GitHub release with the installer package attached.
# (Private repositories are billed per minute, macOS at 10x and Windows at 2x, hence the split.)
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 \
            libfontconfig1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - name: Install
        run: python -m pip install -e . pytest
      - name: Tests
        run: python -m pytest -q

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Only to build the package ("python3" isn't a working command on Windows runners);
      # the installer finds or installs its own Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the installer package
        run: python tools/make_installer_package.py
        shell: bash
      # Install from the package, the way a user would (its own Python check, dependencies,
      # launchers), then run the setup wizard with every default answer.
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist && unzip -q S2Watch-*-installer.zip
          bash S2Watch-*-installer/install.sh --yes --no-wizard
          launcher="$HOME/.local/bin/s2-watch"
          [ "$RUNNER_OS" = macOS ] && launcher="$HOME/Library/Application Support/S2 Watch/bin/s2-watch"
          # Every default answer, from a file: a pipe such as "yes '' | head" fails the step
          # under GitHub's pipefail when its writer is cut off.
          printf '\n%.0s' $(seq 200) > "$RUNNER_TEMP/answers.txt"
          "$launcher" --configure < "$RUNNER_TEMP/answers.txt"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Expand-Archive (Get-ChildItem S2Watch-*-installer.zip).FullName -DestinationPath .
          $installer = (Get-ChildItem -Directory S2Watch-*-installer).FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$installer\install.ps1" -Yes -NoWizard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = "$env:LOCALAPPDATA\S2Watch\venv\Scripts\python.exe"
          $answers = (1..200 | ForEach-Object { '' }) -join "`n"
          $answers | & $python -m s2_watch.main --database "$env:LOCALAPPDATA\S2Watch\data\s2_watch.db" --configure
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\S2 Watch\S2 Watch.lnk")) { throw 'Start menu shortcut missing' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: installer-package
          path: dist/S2Watch-*-installer.zip

  # Install from a git clone (how the team installs, to update with "git pull"): S2 Watch
  # must run from the clone, and a pull that changes the required packages must install them.
  clone-install:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from the clone (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          bash installer/install.sh --yes --no-wizard
          python="$HOME/.local/share/s2-watch/venv/bin/python"
          [ "$RUNNER_OS" = macOS ] && python="$HOME/Library/Application Support/S2 Watch/venv/bin/python"
          echo "VENV_PYTHON=$python" >> "$GITHUB_ENV"
      - name: Install from the clone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File "installer\install.ps1" -Yes -NoWizard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "VENV_PYTHON=$env:LOCALAPPDATA\S2Watch\venv\Scripts\python.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Runs from the clone, and a pulled package change is installed at start
        shell: bash
        run: |
          "$VENV_PYTHON" -c "import s2_watch.checkout as c; assert c.editable_checkout(), 'not an editable install of the clone'"
          # What a pull adding a dependency looks like; S2 Watch installs it when it starts.
          "$VENV_PYTHON" - <<'PY'
          import pathlib
          p = pathlib.Path("pyproject.toml")
          p.write_text(p.read_text().replace("dependencies = [", 'dependencies = [\n    "packaging>=23",', 1))
          PY
          "$VENV_PYTHON" -c "import s2_watch.checkout as c; assert c.refresh_packages_after_pull(), 'pip did not run'; assert not c.refresh_packages_after_pull()"
          "$VENV_PYTHON" -c "import packaging"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, installer, clone-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-package
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/S2Watch-*-installer.zip \
            --title "S2 Watch $version" --generate-notes \
            --notes "Download S2Watch-$version-installer.zip, unzip it, and run install.sh (Linux/macOS) or install.cmd (Windows). Step-by-step instructions: https://github.com/n1rog/S2_Watch/blob/main/INSTALL.md"
